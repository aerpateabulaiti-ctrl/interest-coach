name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scan:secrets
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
      - name: Production smoke
        shell: bash
        run: |
          pnpm start > /tmp/coach-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          pnpm smoke
